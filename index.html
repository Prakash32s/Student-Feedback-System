<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #dfe9f3);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .feedback-container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .feedback-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .feedback-header img {
      border-radius: 50%;
      margin-bottom: 1rem;
    }

    .feedback-header h2 {
      font-weight: 700;
      color: #2c3e50;
    }

    .form-label {
      font-weight: 600;
      color: #34495e;
    }

    .form-control {
      border-radius: 10px;
      border: 1px solid #ced4da;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #4c84ff;
      box-shadow: 0 0 8px rgba(76, 132, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(90deg, #4c84ff, #6c63ff);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #6c63ff, #4c84ff);
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(76, 132, 255, 0.2);
    }

    textarea {
      resize: none;
    }
  </style>
  <script>
    // Allow only letters and spaces
    function restrictInput(event) {
      const char = String.fromCharCode(event.which);
      if (!/^[A-Za-z\s]+$/.test(char)) {
        event.preventDefault();
      }
    }
  </script>
</head>
<body>

  <div class="feedback-container">
    <div class="feedback-header">
      <img src="p.jpg" width="100" height="100" alt="SCTI Logo">
      <h2>Sindhuli Community Technical Institute</h2>
      <p class="text-muted mb-1">Ka Na Pa -06, Nunthala, Sindhuli</p>
      <p class="text-muted">Bagmati Pradesh</p>
      <h4 class="text-primary mt-3">Student Feedback Form</h4>
    </div>

    <form action="submit_feedback.php" method="POST">
      <!-- Full Name -->
      <div class="mb-3">
        <label for="student_name" class="form-label">Full Name</label>
        <input type="text" id="student_name" name="student_name" 
               class="form-control" 
               onkeypress="restrictInput(event)" 
               required>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>

      <!-- Department -->
      <div class="mb-3">
        <label for="level" class="form-label">Department</label>
        <input type="text" id="level" name="level" 
               class="form-control" 
               onkeypress="restrictInput(event)" 
               required>
      </div>

      <!-- Related Subject -->
      <div class="mb-3">
        <label for="subject" class="form-label">Related Subject</label>
        <input type="text" id="subject" name="subject" 
               class="form-control" 
               onkeypress="restrictInput(event)" 
               required>
      </div>

      <!-- Feedback -->
      <div class="mb-3">
        <label for="feedback" class="form-label">Your Feedback</label>
        <textarea id="feedback" name="feedback" class="form-control" 
        rows="4" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Submit Feedback</button>
    </form>
  </div>

</body>
</html>
